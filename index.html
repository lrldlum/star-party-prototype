<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Star Party" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="favicon.ico">
  <title>Star Party — app prototype (draft)</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #141a2c;
      --text: #f3f5f8;
      --muted: #b7c0d1;
      --line: #2a3348;
      --amber: #e0893a;
      --amber-text: #1a1208;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      padding: 16px 16px 32px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.35rem;
      line-height: 1.25;
      margin: 0 0 8px;
      font-weight: 700;
    }
    .banner {
      background: #1b2438;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 16px;
    }
    .banner strong { color: var(--text); font-weight: 650; }
    .step {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      margin: 0 0 6px;
      text-transform: uppercase;
    }
    h2 {
      font-size: 1.15rem;
      margin: 0 0 8px;
    }
    .caption {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      margin: 0 0 14px;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      margin: 0 auto 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      touch-action: pan-y;
    }
    .phone.live { position: relative; }
    .phone iframe {
      display: block;
      border: 0;
      width: 390px;
      height: 844px;
      transform-origin: 0 0;
    }
    .phone img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 6px;
    }
    select {
      width: 100%;
      appearance: none;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 1rem;
    }
    .bar {
      max-width: 390px;
      margin: 0 auto 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .bar button {
      flex: 1 1 120px;
      min-height: 48px;
      border-radius: 12px;
      border: 0;
      font-size: 1rem;
      font-weight: 650;
    }
    .bar button:disabled { opacity: 0.4; }
    .back { background: var(--card); color: var(--text); }
    .next { background: var(--amber); color: var(--amber-text); }
  </style>
</head>
<body>
  <h1>Star Party — app prototype (draft)</h1>
  <p class="banner"><strong>Design prototype.</strong> This is a clickable walkthrough of the approved screens, not the working app yet. Nothing here is signed in, hosted, or connected to a live stack.</p>
  <p class="step" id="step"></p>
  <h2 id="title"></h2>
  <p class="caption" id="caption"></p>
  <div class="phone" id="phone"><img id="screen" alt="" /><iframe id="live" title="Interactive screen" hidden></iframe></div>
  <div class="bar">
    <button class="back" id="back" type="button">Back</button>
    <button class="next" id="next" type="button">Next</button>
  </div>
  <label for="list">Screen list</label>
  <select id="list"></select>
  <script>
    const SCREENS = [
      {"id": "01_welcome", "title": "Welcome", "step": "Account", "caption": "Get started is the one primary action. I already have an account is the quiet alternative."},
      {"id": "02_create_account", "title": "Create account", "step": "Account", "caption": "Name, email, and password with show/hide and an 8+ character hint. The agreement checkbox is required; Create account stays disabled until it is checked. Privacy Policy and Terms sit below."},
      {"id": "03_sky_before", "title": "Your sky", "step": "Step 1 of 6", "caption": "Location is not shared yet, with three short rows on how matching works. Use my location is primary; Enter a town instead is the alternative."},
      {"id": "04_location_permission", "title": "Location permission", "step": "Step 1 of 6", "caption": "A pre-prompt before the system dialog, plus what others see: a fuzzy circle of about 80 km. Continue shows the system prompt; Not now is the alternative."},
      {"id": "05_sky_matched", "title": "Sky matched", "step": "Step 1 of 6", "caption": "The matched area and 7 imagers under that sky. Continue is primary; Change area is the alternative."},
      {"id": "06_join_party", "title": "Join a party", "step": "Step 2 of 6", "caption": "Tonight's party with host, members, sunset close, and a shared-master reminder. Join party is primary; Start a new party is the alternative."},
      {"id": "07_name_party", "title": "Name a party", "step": "Step 2 of 6", "caption": "Start and name a party, including sky, voting close, host, and who can join. Create party is primary; Join an existing party is the alternative."},
      {"id": "08_vote", "title": "Tonight's vote", "step": "Step 3 of 6", "caption": "Vote before it closes at sunset, with a Selected card. Vote for the target is primary; Suggest a target is the alternative."},
      {"id": "09_voted", "title": "Voted", "step": "Step 3 of 6", "caption": "Confirmation that you voted for M42. Continue is primary; Change vote is the alternative."},
      {"id": "10_rig", "title": "Your rig", "step": "Step 4 of 6 · Rig", "caption": "Pickers for the rig; image scale and field of view are computed. Save rig is primary; Skip for now is the alternative."},
      {"id": "11_asiair_wifi", "title": "ASIAIR Wi-Fi", "step": "Step 4 of 6 · ASIAIR 1/3", "caption": "Join the ASIAIR Wi-Fi hotspot, with three numbered steps and a static preview of what to look for. Open Wi-Fi settings is primary; I've joined it is the alternative."},
      {"id": "12_local_network", "title": "Local network", "step": "Step 4 of 6 · ASIAIR 2/3", "caption": "Local-network pre-prompt with a dashed, labelled preview of the system prompt (the preview has no buttons). Continue shows the system prompt; Not now is the alternative."},
      {"id": "13_asiair_found", "title": "ASIAIR found", "step": "Step 4 of 6 · ASIAIR 3/3", "caption": "Files found: Wi-Fi, permission, 12 subs, and libraries. Connect ASIAIR is primary; Choose another ASIAIR is the alternative."},
      {"id": "14_calibration", "title": "Calibration", "step": "Step 5 of 6", "caption": "Darks and bias are Ready; flats are Missing. Flats apply to the final master. Continue to live stack is primary; How to shoot flats is the alternative."},
      {"id": "15_live_stack_chat", "title": "Live stack + chat", "step": "Step 6 of 6", "caption": "Master preview, your rig status, a Be kind line, a hold cue on the first member message, and the party menu. Send is primary; Before / after is the alternative."},
      {"id": "15a_master_color", "live": "master.html#tab=color", "title": "Master tabs · Color", "step": "Master · Interactive", "caption": "Interactive. Tap the filter tabs: Color, L, R, G, B, Ha, OIII, SII, then RGB and Blend. Each filter tab shows that filter's master with its sub count, integration time and rigs. Subs are grouped by the FITS FILTER header; one-shot-color subs go to Color. Sample data."},
      {"id": "15b_master_ha", "live": "master.html#tab=Ha", "title": "Master tabs · Ha", "step": "Master · Interactive", "caption": "The Ha master from the mono rigs: 12 subs, 1 h of integration, 2 rigs. It shows the faint outer hydrogen the color subs miss. Sample data."},
      {"id": "15c_master_empty", "live": "master.html#tab=SII", "title": "Master tabs · No subs yet", "step": "Master · Interactive", "caption": "A filter nobody has shot yet (SII here) shows an empty state: no subs yet for that filter. The tab chip is dashed so empty filters read at a glance."},
      {"id": "15d_rgb_combine", "live": "master.html#tab=rgb", "title": "RGB combine", "step": "Master · Interactive", "caption": "RGB combine: the mono R, G and B masters are matched for background and brightness, weighted, and added to the Color master at the strength you pick (Weighted average or Lighten). Drag across the preview to compare; save it as its own FITS. Sample data."},
      {"id": "15e_rgb_missing", "live": "master.html#tab=rgb&sample=noB", "title": "RGB combine · missing channel", "step": "Master · Interactive", "caption": "With no B subs, RGB combine is off and says which channel is missing. The RGB chip is dashed like an empty filter. Sample data."},
      {"id": "15f_blend_ha_red", "live": "master.html#tab=blend&view=manual&src=Ha&target=R", "title": "Blend · Ha to R", "step": "Master · Interactive", "caption": "Blend a narrowband master into one channel of the Color master. Pick Ha, OIII or SII (SII is off until someone shoots it), then R, G, B or Lum, the strength and the mode. Ha into red saves as HaRGB. Sample data."},
      {"id": "15g_blend_oiii_green", "live": "master.html#tab=blend&view=manual&src=OIII&target=G", "title": "Blend · OIII to G", "step": "Master · Interactive", "caption": "OIII into green: the teal core gets the oxygen signal. It saves as RGB + OIII, with the target channel shown on the mode line. SII stays listed but disabled because nobody has shot SII yet. Sample data."},
      {"id": "15h_blend_ha_lum", "live": "master.html#tab=blend&view=manual&src=Ha&target=L&strength=100", "title": "Blend · Ha to Lum", "step": "Master · Interactive", "caption": "Ha into luminance at 100% with Lighten. Hue is kept; only brightness and detail come from Ha. It saves as HaLRGB. The masters are never changed. Sample data."},
      {"id": "15i_auto_hargb", "live": "master.html#tab=blend&view=auto&sample=oscha", "title": "Auto · HaRGB", "step": "Master · Interactive", "caption": "Auto, with only Color and Ha: it picks HaRGB (continuum-subtracted Ha into red), searches the strength until the best sits inside the range, and shows it between a weaker and a stronger variant with Good / Close / Weak bands. Apply saves it; Tweak opens Manual preloaded. The comparison is mock until an AstroBin API key is added. Sample data."},
      {"id": "15j_auto_hoo", "live": "master.html#tab=blend&view=auto&sample=nb", "title": "Auto · HOO", "step": "Master · Interactive", "caption": "Auto, with only mono Ha and OIII: it picks the HOO bicolor palette (Ha red, OIII green and blue) and shows it between variants with less and more Ha in green, each with a Good / Close / Weak band. Tweak opens the palette editor preloaded. The comparison is mock until an AstroBin API key is added. Sample data."},
      {"id": "15k_palette_editor", "live": "master.html#tab=blend&view=manual&sample=nb&pal=HOO", "title": "Blend · HOO palette", "step": "Master · Interactive", "caption": "Manual palette editor for narrowband-only parties: HOO with a Ha-in-green slider, or Foraxx. SHO stays off until someone shoots SII. Saves as its own FITS. Sample data."},
      {"id": "15l_download_master", "live": "master.html#tab=Ha&sheet=Ha", "title": "Download a master", "step": "Master · Downloads", "caption": "Any party member can download any master: 32-bit float FITS (linear, default), 16-bit TIFF, or a stretched PNG / JPEG preview. FITS headers carry FILTER, EXPTIME, NCOMBINE, OBJECT and PARTY. Downloads a tiny sample file here."},
      {"id": "15m_download_all", "live": "master.html#tab=color&sheet=all", "title": "Download all (zip)", "step": "Master · Downloads", "caption": "Download all: every master, composite and saved product in one zip, with a README of what's included and what isn't yet (SII, SHO). From the All button at the top of every master tab. Sample files."},
      {"id": "15n_rgb_composite", "live": "master.html#tab=rgb&sheet=RGB", "title": "Download the RGB composite", "step": "Master · Downloads", "caption": "The RGB and SHO composites download as linear FITS from the RGB tab. SHO (SII→R, Ha→G, OIII→B) stays greyed with 'Needs SII master' until someone shoots SII. Sample files."},
      {"id": "15o_send_asiair", "live": "master.html#tab=Ha&sheet=Ha&send=done", "title": "Send to ASIAIR", "step": "Master · Send to ASIAIR", "caption": "Send to ASIAIR (simulated): the FITS goes to StarParty/<party>/<target>/ on your own ASIAIR over its Wi-Fi, to internal storage or USB / SD. It never overwrites: Ha was already there, so the new one is _2."},
      {"id": "15p_send_no_space", "live": "master.html#tab=color&sheet=all&send=nospace", "title": "Send to ASIAIR · no space", "step": "Master · Send to ASIAIR", "caption": "Free space is checked before anything is written. Not enough room: it says how much is needed and free, and that nothing was written. Simulated."},
      {"id": "15q_send_offline", "live": "master.html#tab=Ha&sheet=Ha&send=offline", "title": "Send to ASIAIR · not on its Wi-Fi", "step": "Master · Send to ASIAIR", "caption": "The phone has to be on your ASIAIR's network, and masters only go to the ASIAIR paired to your account. Simulated."},
      {"id": "15r_rigs", "live": "rigs.html#view=list", "title": "Profile · Rigs", "step": "Profile · Rigs", "caption": "Named rigs with camera, telescope, mount, reducer and binning; each shows effective focal length, f-ratio, arcsec per pixel and field of view. Make default, Duplicate, Delete. Sample data."},
      {"id": "15s_rig_edit", "live": "rigs.html#view=edit&rig=1&search=camera&q=2600", "title": "Edit rig · presets", "step": "Profile · Rigs", "caption": "Search camera and telescope presets (ZWO ASI2600MC Pro, Justin's 600 mm Newtonian…) or type your own. OSC or mono, reducer and binning; optics update live. Sample data."},
      {"id": "15t_rig_join", "live": "rigs.html#view=join", "title": "Join with a rig", "step": "Party · Join", "caption": "When joining a party or target, pick the rig you're shooting with (the default is preselected). Subs and masters store it, so stacking and plate solving use its scale. Sample data."},
      {"id": "15u_sky_view", "live": "sky.html#live=1", "title": "Sky view", "step": "Party · Sky view", "caption": "A star map centered on M42 with each member's field of view, color-coded, rotated and sized from their plate solve. Bea hasn't solved yet, so her frame is dashed, sized from her rig. Watch: it solves after a few seconds. Sample frames."},
      {"id": "15v_sky_detail", "live": "sky.html#sel=amy", "title": "Sky view · frame details", "step": "Party · Sky view", "caption": "Tap a frame (or a member) for that member's rig: camera, scope, scale, field, rotation and whether the frame is solved. Sample frames."},
      {"id": "15w_sky_solved", "live": "sky.html#state=solved", "title": "Sky view · all solved", "step": "Party · Sky view", "caption": "Live update: Bea's first sub plate-solved, so her dashed frame snapped to the solved position and rotation; coverage and overlap update. Sample frames."},
      {"id": "16_message_actions", "title": "Message actions", "step": "Step 6 of 6", "caption": "Long-press sheet on a message: Report message, Block, Copy text, or Cancel."},
      {"id": "17_party_menu", "title": "Party menu", "step": "Step 6 of 6", "caption": "The party menu sheet: Party members, Report a problem, Block a member, Leave party, or Cancel."},
      {"id": "18_leave_party", "title": "Leave party", "step": "Step 6 of 6", "caption": "Confirm leaving: you stop contributing and leave chat. Subs already in the stack stay in, so you remain a participant and keep the final master. Leave party is the destructive action; Cancel returns."},
      {"id": "19_settings", "title": "Account settings", "step": "Profile", "caption": "Default is Private, and changes apply instantly. Includes Public/Private, red-light mode, the agreement, Privacy Policy, Terms, Data and permissions, Sign out, and Delete account."},
      {"id": "20_settings_saved", "title": "Settings saved", "step": "Profile", "caption": "The same settings screen right after switching to Public, with a Saved · Public confirmation pill."},
      {"id": "21_delete_account", "title": "Delete account", "step": "Profile", "caption": "Confirm deletion: which account, what is deleted, what stays with parties, Download my data, and a web deletion link. Delete my account is destructive; Cancel returns."},
      {"id": "22_red_mode_live", "title": "Red-light mode", "step": "Step 6 of 6 · Red-light", "caption": "The live stack + chat in red-light mode, with no status bar. Send is primary; Before / after is the alternative."},
      {"id": "23_xl_create_account", "title": "Large text · Create account", "step": "Accessibility · 200% text", "caption": "The sign-up screen at 200% text as a full scrolling page. The checkbox, eye, pills, and captions are scaled."},
      {"id": "24_xl_live", "title": "Large text · Live stack", "step": "Accessibility · 200% text", "caption": "Live stack + chat at 200% text as a full scrolling page. Tab icons, labels, the menu, dots, and captions are scaled."}
    ];
    let index = 0;
    const title = document.getElementById("title");
    const step = document.getElementById("step");
    const caption = document.getElementById("caption");
    const img = document.getElementById("screen");
    const live = document.getElementById("live");
    const phoneBox = document.getElementById("phone");
    function fitLive() {
      const scale = Math.min(1, phoneBox.clientWidth / 390);
      live.style.transform = "scale(" + scale + ")";
      phoneBox.style.height = live.hidden ? "" : Math.round(844 * scale) + "px";
    }
    window.addEventListener("resize", fitLive);
    const list = document.getElementById("list");
    const back = document.getElementById("back");
    const next = document.getElementById("next");
    SCREENS.forEach((s, i) => {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = (i + 1) + ". " + s.title;
      list.appendChild(opt);
    });
    function render() {
      const s = SCREENS[index];
      title.textContent = s.title;
      step.textContent = (index + 1) + " of " + SCREENS.length + " · " + s.step;
      caption.textContent = s.caption;
      if (s.live) {
        img.hidden = true;
        img.removeAttribute("src");
        live.hidden = false;
        const loaded = live.dataset.src && live.contentWindow && live.contentWindow.location.pathname.endsWith(s.live.split("#")[0]);
        if (loaded) live.contentWindow.location.hash = s.live.split("#")[1];
        else { live.src = s.live; live.dataset.src = s.live; }
        live.title = "Interactive Star Party screen: " + s.title;
      } else {
        live.hidden = true;
        img.hidden = false;
        img.src = "screens/" + s.id + ".webp";
        img.alt = "Star Party screen: " + s.title;
      }
      fitLive();
      list.value = String(index);
      back.disabled = index === 0;
      next.disabled = index === SCREENS.length - 1;
      if (!s.live) window.scrollTo({ top: 0, behavior: "instant" });
    }
    function go(delta) {
      const nextIndex = index + delta;
      if (nextIndex < 0 || nextIndex >= SCREENS.length) return;
      index = nextIndex;
      render();
    }
    back.addEventListener("click", () => go(-1));
    next.addEventListener("click", () => go(1));
    list.addEventListener("change", () => { index = Number(list.value); render(); });
    let touchStartX = 0;
    let touchStartY = 0;
    const phone = document.querySelector(".phone");
    phone.addEventListener("touchstart", (e) => {
      const t = e.changedTouches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: true });
    phone.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (!live.hidden) return;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        go(dx < 0 ? 1 : -1);
      }
    }, { passive: true });
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || d.type !== "st-master-tab" || e.source !== live.contentWindow || !SCREENS[index].live) return;
      // a screen matches when every parameter in its link is in the iframe's state; prefer the current one, then the most specific
      const got = new URLSearchParams(d.hash || ("tab=" + d.tab));
      const fits = (sc) => { if (!sc.live || !sc.live.startsWith("master.html#")) return -1; const want = new URLSearchParams(sc.live.split("#")[1]);
        if ((want.get("sample") || "full") !== (got.get("sample") || "full")) return -1;
        for (const [k, v] of want) if (k !== "sample" && got.get(k) !== v) return -1; return [...want].length; };
      let best = fits(SCREENS[index]), match = best >= 0 ? index : -1;
      SCREENS.forEach((sc, i) => { const f = fits(sc); if (f > best) { best = f; match = i; } });
      if (match >= 0) { index = match; list.value = String(index); step.textContent = (index + 1) + " of " + SCREENS.length + " · " + SCREENS[index].step; back.disabled = index === 0; next.disabled = index === SCREENS.length - 1; }
      title.textContent = d.label;
      caption.textContent = d.caption;
    });
    const hashId = location.hash.slice(1);
    const hashIndex = SCREENS.findIndex((s) => s.id === hashId || (hashId === "master" && s.id === "15a_master_color"));
    if (hashIndex >= 0) index = hashIndex;
    render();
  </script>
</body>
</html>
