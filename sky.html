.live{font-size:12px;font-weight:700;color:#5CC9B5;border:1px solid #2A5A55;border-radius:999px;padding:3px 10px;display:flex;align-items:center;gap:6px}

.party{font-size:15px;font-weight:600;color:#8FA3B5;line-height:21px}
h1{font-size:28px;line-height:34px;font-weight:700;margin:2px 0 4px}
.small{font-size:13px;color:#8FA3B5;line-height:18px}

.panel>*{flex-shrink:0}
.map{position:relative;width:100%;max-width:350px;height:330px;border-radius:16px;overflow:hidden;background:#02050a;border:1px solid #1C2B3A;margin-top:8px;cursor:pointer;touch-action:none}
.map canvas{position:absolute;top:0;left:0}
@media (max-height:720px){.map{height:230px}}
.map .cmp{position:absolute;right:8px;top:8px;font-size:11px;color:#8FA3B5;background:rgba(2,5,10,.7);padding:2px 7px;border-radius:999px}
.map .smp{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;color:#B4C0CC;background:rgba(7,16,24,.72);padding:2px 8px;border-radius:999px}
.map .scale{position:absolute;left:10px;bottom:10px;font-size:11px;color:#8FA3B5}
.map .scale b{display:block;height:2px;background:#8FA3B5;margin-bottom:3px}
.cov{display:flex;gap:6px;margin-top:10px}
.cov div{flex:1;background:#0E1A26;border:1px solid #1C2B3A;border-radius:12px;padding:8px 10px}
.cov b{display:block;font-size:17px}.cov span{font-size:11px;color:#8FA3B5;font-weight:600;letter-spacing:.3px}
.lbt{font-size:13px;color:#8FA3B5;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:14px 0 4px}
.mem{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;background:#0E1A26;border:1px solid #1C2B3A;border-radius:14px;padding:6px 12px;margin-top:5px;color:#E8EEF4;text-align:left;cursor:pointer;font:inherit}
.mem.on{border-width:2px;padding:5px 11px}
.mem .sw{width:16px;height:12px;border-radius:2px;border:2px solid;flex:none}
.mem .sw.dash{border-style:dashed}
.mem b{display:block;font-size:15px}.mem span{font-size:12px;color:#8FA3B5;line-height:16px}
.mem .st{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.det{background:#0E1A26;border:2px solid;border-radius:16px;padding:10px 14px;margin-top:10px}
.det b{font-size:17px}
.det .g{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin-top:6px;font-size:13px}
.det .g span:nth-child(odd){color:#8FA3B5}
.fade{position:sticky;bottom:-16px;height:44px;margin-top:-44px;margin-bottom:-16px;pointer-events:none;background:linear-gradient(rgba(7,16,24,0),#071018 70%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;transition:opacity .2s}
.fade span{font-size:12px;font-weight:600;color:#8FA3B5}
.fade.off{opacity:0}
.credit{font-size:11px;color:#6E8293;line-height:15px;margin-top:12px}
.tabs{height:83px;margin:0 -20px;border-top:1px solid #1C2B3A;display:flex;justify-content:space-around;padding-top:8px;background:#09131C}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#8FA3B5;width:96px;height:60px;padding-top:4px}
.tab svg{width:26px;height:26px}.tab.on{color:#E8A05A}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:#13283A;border:1px solid #2A5A55;color:#5CC9B5;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}

.map-msg{display:flex;align-items:flex-start;justify-content:flex-start;flex-direction:column;text-align:left;padding:10px 12px;margin-top:8px;font-size:14px;font-weight:600;color:#8FA3B5;background:#0E1A26;border:1px solid #1C2B3A;border-radius:14px;gap:8px}
.map-msg[hidden]{display:none !important}
.map-msg button{height:44px;padding:0 16px;border-radius:22px;border:1px solid #1C2B3A;background:#0B141E;color:#5CC9B5;font:600 15px Inter,-apple-system,sans-serif;cursor:pointer}

  if (m) { const f = frameOf(m);
    det.style.borderColor = COLORS[m.id];
    det.innerHTML = `<b>${m.name}${m.rig ? " · " + m.rig.name : ""}</b><div class="g">` + (m.rig ? `<span>Camera</span><span>${m.rig.camera}</span><span>Scope</span><span>${m.rig.telescope}</span><span>Scale</span><span>${m.rig.scale.toFixed(2)}″/px</span>` : `<span>Rig</span><span>Not set yet</span>`) +
      (f ? `<span>Field</span><span>${(f.w * 60).toFixed(0)}′ × ${(f.h * 60).toFixed(0)}′</span><span>Rotation</span><span>${m.solve.source === "solved" ? `PA ${m.solve.pa.toFixed(1)}°` : "unknown until solved (shown 0°)"}</span><span>Frame</span><span>${m.solve.source === "solved" ? "Solved · " + m.solve.via : "Pending solve · " + m.solve.via}</span>` : `<span>Frame</span><span>Waiting for a first sub</span>`) + "</div>";
  }
  $("credit").textContent = CREDIT + ` Map drawn by Star Party; no third-party renderer code. Sample frames for ${PEOPLE} members, ${MEMBERS.length} rigs (the same roster as the Master tabs).`;

function pick(id) { sel = sel === id ? null : id; render(); }
$("map").onclick = (e) => {
  const r = cv.getBoundingClientRect(), pt = [e.clientX - r.left, e.clientY - r.top];
  const hits = MEMBERS.map(frameOf).filter(Boolean).filter((f) => inside(pt, f.pts.map(toScr))).sort((a, b) => a.w * a.h - b.w * b.h);
  sel = hits[0] ? hits[0].m.id : null; render();
};
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); }
// live: after a few seconds Bea's first sub plate-solves and her dashed frame snaps to the solved one
function solveBea() { const b = MEMBERS.find((m) => m.id === "bea"); b.solve = { ...b.solved }; phase = "solved"; $("live").lastChild.textContent = "Live · updated 9:59 PM"; render(); }
function sync() {
  const p = new URLSearchParams(); if (sel) p.set("sel", sel); if (phase === "solved") p.set("state", "solved");
  history.replaceState(null, "", "#" + p.toString());
  if (window.parent !== window) window.parent.postMessage({ type: "st-master-tab", tab: "sky", hash: location.hash.slice(1), label: phase === "solved" ? "Sky view · all solved" : sel ? "Sky view · frame details" : "Sky view · M42",
    caption: phase === "solved" ? "Live update: Bea's first sub plate-solved, so her dashed rig-sized frame snapped to the solved position and rotation. Coverage and overlap update. Sample frames." :
      sel ? "Tap a frame (or a member) for that member's rig: camera, scope, scale, field, rotation and whether the frame is solved. Sample frames." :
      "Sky view: a star map centered on M42 with each member's field of view, color-coded, rotated and sized from their plate solve. Bea hasn't solved yet, so her frame is dashed, sized from her rig at the mount's pointing. Sample frames: the same 6 members and 7 rigs the Master tabs credit." }, "*");
}
function showMapMsg(html) { const el = $("mapMsg"); if (!el) return; if (!html) { el.hidden = true; el.innerHTML = ""; return; } el.hidden = false; el.innerHTML = html; }
function loadStars() {
  showMapMsg("Loading star catalog…");
  applyHash(); // honor #state=solved and draw the roster under the overlay; do not render/sync first or the hash is cleared
  return fetch("sky/stars_m42.json").then((r) => { if (!r.ok) throw new Error("star catalog " + r.status); return r.json(); })
    .then((d) => { STARS = d.stars; CREDIT = d.credit; showMapMsg(""); init(); })
    .catch(() => { showMapMsg(`Couldn't load the star map. Check your connection and try again.<button type="button" id="retryStars">Try again</button>`); $("retryStars").onclick = loadStars; applyHash(); });
}
function applyHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const s = MEMBERS.some((m) => m.id === p.get("sel")) ? p.get("sel") : null;
  let changed = false;
  if (s !== sel) { sel = s; changed = true; }
  if (p.get("state") === "solved" && phase !== "solved") { solveBea(); return; } // solveBea already renders

function init() {

  const p = new URLSearchParams(location.hash.slice(1));

window.addEventListener("hashchange", applyHash);
applyHash();
new ResizeObserver(() => { if (sizeCanvas()) render(); }).observe($("map"));
loadStars();
</script>
